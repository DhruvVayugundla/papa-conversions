<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remedy conversions</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <h1>Remedy conversions</h1>
      <p class="meta">
        <span id="counts">Loading…</span>
      </p>
      <label class="filter">
        Filter by Telugu issue
        <select id="nameFilter">
          <option value="">All issues</option>
        </select>
      </label>
    </header>

    <main>
      <section id="cards" class="cards">
        <article class="card">
          <h2>English</h2>
          <div id="en" class="body">Loading…</div>
        </article>
        <article class="card">
          <h2>Telugu</h2>
          <div id="te" class="body">Loading…</div>
        </article>
        <article class="card">
          <h2>Hindi</h2>
          <div id="hi" class="body">Loading…</div>
        </article>
      </section>

      <section class="entry">
        <p class="oid">OID: <code id="oid">—</code></p>
        <label for="correction">Correction</label>
        <textarea
          id="correction"
          rows="5"
          placeholder="Enter a correction for this remedy"
        ></textarea>
        <div class="actions">
          <button id="editBtn" type="button">Edit</button>
          <button id="okBtn" type="button" class="secondary">
            Save & Next
          </button>
        </div>
        <p class="save-hint">
          "Save & Next" writes language edits and the correction to MongoDB and
          marks the item visited.
        </p>
        <p id="status" class="status"></p>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
